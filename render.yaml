services:
  - type: web
    name: obra-facil
    runtime: node
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: false
    disk:
      name: obra-facil-data
      mountPath: /var/data/obra-facil
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: DATA_DIRECTORY
        value: /var/data/obra-facil
      - key: PUBLIC_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
